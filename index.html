<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធស្កេនវត្តមាន (NPIC)</title>
    <link href="https://fonts.googleapis.com/css?family=Khmer+OS+Siemreap&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #2f4e7d; /* ពណ៌ផ្ទៃខាងក្រោយ */
            font-family: 'Khmer OS Siemreap', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }
        .card { 
            background-color: white; 
            border-radius: 20px; 
            padding: 30px; 
            width: 100%; max-width: 450px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            text-align: center; 
        }
        h4 { color: #2f4e7d; margin: 0 0 5px 0; font-size: 16px; font-weight: normal; }
        h2 { color: #2f4e7d; margin: 0 0 15px 0; font-size: 24px; }
        .clock { font-size: 32px; color: #e74c3c; font-weight: bold; margin-bottom: 10px; }
        .location-status { font-size: 14px; color: #27ae60; margin-bottom: 20px; font-weight: bold; }
        
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .input-group { flex: 1; text-align: left; margin-bottom: 15px; }
        .input-group.full { width: 100%; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 14px; color: #555; margin-bottom: 8px; }
        
        select, input { 
            width: 100%; padding: 12px; 
            border: 1px solid #ccc; border-radius: 8px; 
            font-family: 'Khmer OS Siemreap', sans-serif; font-size: 15px; 
            outline: none; box-sizing: border-box;
        }
        select:focus, input:focus { border-color: #2f4e7d; }
        
        .btn-submit { 
            background-color: #2f4e7d; color: white; border: none; 
            padding: 15px; width: 100%; border-radius: 8px; 
            font-size: 18px; font-weight: bold; font-family: 'Khmer OS Siemreap', sans-serif; 
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .btn-submit:hover:not(:disabled) { background-color: #1f365c; }
        
        .error-msg { color: #e74c3c; margin-top: 15px; font-weight: bold; display: none; font-size: 15px; }
        .success-msg { color: #27ae60; margin-top: 15px; font-weight: bold; display: none; font-size: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h4>វិទ្យាស្ថានជាតិពហុបច្ចេកទេសកម្ពុជា</h4>
        <h2>ស្កេនវត្តមាន (Student)</h2>
        
        <!-- នាឡិកា -->
        <div class="clock" id="liveClock">00:00:00 PM</div>
        <div class="location-status" id="locationStatus">⏳ កំពុងពិនិត្យទីតាំង...</div>

        <!-- ជ្រើសរើសឆ្នាំ និង ក្រុម -->
        <div class="row">
            <div class="input-group">
                <label>ឆ្នាំសិក្សា (Year)</label>
                <select id="studentYear">
                    <option value="Year 1">ឆ្នាំទី ១</option>
                    <option value="Year 2">ឆ្នាំទី ២</option>
                    <option value="Year 3" selected>ឆ្នាំទី ៣</option>
                    <option value="Year 4">ឆ្នាំទី ៤</option>
                </select>
            </div>
            <div class="input-group">
                <label>ក្រុម (Group)</label>
                <select id="studentGroup">
                    <option value="B.EcE.A" selected>B.EcE.A</option>
                    <option value="B.EcE.B">B.EcE.B</option>
                    <option value="B.EcE.C">B.EcE.C</option>
                </select>
            </div>
        </div>

        <!-- ជ្រើសរើសមុខវិជ្ជា -->
        <div class="input-group full">
            <label>មុខវិជ្ជា (Subject)</label>
            <select id="studentClass">
                <option value="" disabled selected>⏳ កំពុងទាញយកមុខវិជ្ជា...</option>
            </select>
        </div>

        <!-- បញ្ចូលឈ្មោះ -->
        <div class="input-group full">
            <label>លេខរៀង និងឈ្មោះ (ID & Name)</label>
            <input type="text" id="studentName" placeholder="ឧទាហរណ៍៖ 21. PO CHANDARA" required>
        </div>

        <!-- ចំណាំ -->
        <div class="input-group full">
            <label>ចំណាំ (Note) - មិនចាំបាច់ក៏បាន</label>
            <input type="text" id="studentNote" placeholder="ឧទាហរណ៍៖ មកយឺតដោយសារភ្លៀង">
        </div>

        <!-- ប៊ូតុងបញ្ជូន -->
        <button class="btn-submit" id="btnSubmit" onclick="submitAttendance()" disabled>ស្កេនវត្តមានឥឡូវនេះ</button>
        
        <div class="error-msg" id="errorMsg">⏳ កំពុងពិនិត្យទីតាំង GPS...</div>
        <div class="success-msg" id="successMsg">✅ វត្តមានរបស់អ្នកត្រូវបានកត់ត្រា!</div>
    </div>

    <script>
        // 🔴 ដូរ URL នេះទៅជា URL Google Script របស់បងប្រសិនបើវាខុស
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby39WkYdxnf64jL95NiO5_2fu4XbgwA_a2O63i4O_SzKRa5gC9aZqSvLsaFBFYZGxIcow/exec";
        
        let currentMethod = "Web App";
        let isLocationValid = false; // តេស្ត GPS ថាត្រូវឬអត់

        // កូអរដោនេ សាលា NPIC ពិតប្រាកដ (Latitude & Longitude)
        const NPIC_LAT = 11.5780; 
        const NPIC_LNG = 104.8112; 
        const MAX_DISTANCE_KM = 5.0; // កំណត់ ៥ គីឡូម៉ែត្រ

        // ១. ដំណើរការពេលបើកវិបសាយភ្លាម
        window.onload = function() {
            // ឆែកមើលក្រែងលោសិស្សស្កេនតាម NFC (មាន ?method=NFC ពីក្រោយ Link)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('method') === 'NFC') {
                currentMethod = "NFC";
            }

            fetchClasses();
            checkLocation(); // ឆែក GPS មុនគេ
            startClock();    // បន្ទាប់មកទើបឱ្យនាឡិកាដើរ
        };

        // ២. មុខងារឆែក GPS ពិតប្រាកដ (Real Geolocation)
        function checkLocation() {
            const statusEl = document.getElementById("locationStatus");
            statusEl.innerHTML = "⏳ កំពុងទាញយកទីតាំង GPS របស់អ្នក...";
            statusEl.style.color = "#f39c12";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userLat = position.coords.latitude;
                        const userLng = position.coords.longitude;
                        
                        // រូបមន្ត Haversine គណនាចម្ងាយពិតពីទូរស័ព្ទទៅសាលា NPIC
                        const R = 6371; 
                        const dLat = (userLat - NPIC_LAT) * Math.PI / 180;
                        const dLng = (userLng - NPIC_LNG) * Math.PI / 180;
                        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                                  Math.cos(NPIC_LAT * Math.PI / 180) * Math.cos(userLat * Math.PI / 180) *
                                  Math.sin(dLng/2) * Math.sin(dLng/2);
                        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                        const distance = R * c; 

                        if (distance <= MAX_DISTANCE_KM) {
                            statusEl.innerHTML = `✅ ទីតាំងត្រឹមត្រូវ (ចម្ងាយ: ${distance.toFixed(2)}Km)`;
                            statusEl.style.color = "#27ae60";
                            isLocationValid = true;
                        } else {
                            statusEl.innerHTML = `❌ អ្នកនៅក្រៅសាលា (ចម្ងាយ: ${distance.toFixed(2)}Km)`;
                            statusEl.style.color = "#e74c3c";
                            isLocationValid = false;
                        }
                    },
                    (error) => {
                        statusEl.innerHTML = "⚠️ សូមបើក GPS (Location) លើទូរស័ព្ទ រួច Refresh ឡើងវិញ!";
                        statusEl.style.color = "#e74c3c";
                        isLocationValid = false;
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                statusEl.innerHTML = "⚠️ ទូរស័ព្ទរបស់អ្នកមិនគាំទ្រប្រព័ន្ធ GPS ទេ!";
                statusEl.style.color = "#e74c3c";
                isLocationValid = false;
            }
        }

        // ៣. នាឡិកាដើរផ្ទាល់ និងដោះសោរតាមម៉ោង + ទីតាំង
        function startClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('liveClock').innerHTML = now.toLocaleTimeString('en-US', { hour12: true });
                
                const hour = now.getHours();
                const btn = document.getElementById("btnSubmit");
                const errorMsg = document.getElementById("errorMsg");

                // លក្ខខណ្ឌតឹងរ៉ឹង៖ ត្រូវតែស្ថិតក្នុងម៉ោង (៦ព្រឹក-៦ល្ងាច) **និង** នៅក្បែរសាលា (ក្នុងរង្វង់ 5Km)
                if (hour >= 6 && hour < 18 && isLocationValid) {
                    btn.disabled = false;
                    errorMsg.style.display = "none";
                } else if (!isLocationValid) {
                    btn.disabled = true;
                    errorMsg.style.display = "block";
                    errorMsg.innerHTML = "❌ បរាជ័យ៖ អ្នកត្រូវតែនៅជិតសាលា (ក្នុងរង្វង់ ៥ គីឡូម៉ែត្រ)!";
                } else {
                    btn.disabled = true;
                    errorMsg.style.display = "block";
                    errorMsg.innerHTML = "❌ ហួសម៉ោងស្កេនវត្តមានហើយ!";
                }
            }, 1000);
        }

        // ៤. ទាញយកឈ្មោះមុខវិជ្ជាពី Database
        function fetchClasses() {
            const classDropdown = document.getElementById("studentClass");
            fetch(GOOGLE_SCRIPT_URL + "?action=getClasses")
                .then(response => response.json())
                .then(data => {
                    classDropdown.innerHTML = '<option value="" disabled selected>-- សូមជ្រើសរើសមុខវិជ្ជា --</option>';
                    data.forEach(cls => {
                        const option = document.createElement("option");
                        option.value = cls;
                        option.text = cls;
                        classDropdown.appendChild(option);
                    });
                })
                .catch(error => {
                    classDropdown.innerHTML = '<option value="" disabled selected>⚠️ បរាជ័យក្នុងការទាញយក</option>';
                });
        }

        // ៥. មុខងារបញ្ជូនវត្តមានទៅ Google Sheets
        function submitAttendance() {
            const year = document.getElementById("studentYear").value;
            const group = document.getElementById("studentGroup").value;
            const className = document.getElementById("studentClass").value;
            const name = document.getElementById("studentName").value.trim();
            const note = document.getElementById("studentNote").value.trim();
            
            const btn = document.getElementById("btnSubmit");
            const errorMsg = document.getElementById("errorMsg");
            const successMsg = document.getElementById("successMsg");

            // លក្ខខណ្ឌតម្រូវ
            if (!className) {
                errorMsg.innerHTML = "❌ សូមជ្រើសរើសមុខវិជ្ជាសិន!";
                errorMsg.style.display = "block";
                return;
            }
            if (name === "") {
                errorMsg.innerHTML = "❌ សូមបំពេញ លេខរៀង និងឈ្មោះ របស់អ្នក!";
                errorMsg.style.display = "block";
                return;
            }

            // រៀបចំបញ្ជូន
            btn.disabled = true;
            btn.innerHTML = "⏳ កំពុងបញ្ជូនទិន្នន័យ...";
            errorMsg.style.display = "none";
            successMsg.style.display = "none";

            const payload = {
                source: "web_app", 
                year: year,
                group: group,
                class_name: className,
                name: name,
                note: note,
                method: currentMethod 
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.text())
            .then(data => {
                if (data.includes("Success")) {
                    successMsg.innerHTML = "✅ វត្តមានត្រូវបានកត់ត្រាចូលប្រព័ន្ធជោគជ័យ!";
                    successMsg.style.display = "block";
                    document.getElementById("studentName").value = "";
                    document.getElementById("studentNote").value = "";
                } else if (data.includes("Already Scanned")) {
                    errorMsg.innerHTML = "⚠️ អ្នកបានស្កេនវត្តមានមុខវិជ្ជានេះរួចរាល់ហើយ សម្រាប់ថ្ងៃនេះ!";
                    errorMsg.style.display = "block";
                } else {
                    errorMsg.innerHTML = "❌ បរាជ័យ៖ " + data;
                    errorMsg.style.display = "block";
                }
            })
            .catch(error => {
                errorMsg.innerHTML = "❌ បរាជ័យក្នុងការភ្ជាប់ទៅកាន់ប្រព័ន្ធ!";
                errorMsg.style.display = "block";
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = "ស្កេនវត្តមានឥឡូវនេះ";
            });
        }
    </script>
</body>
</html>
